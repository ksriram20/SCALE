name: Sriram
role: Assistant Professor & Researcher
domain: Higher education and academic research
country: India

institution_context: |
  Indian higher-education system. Careers run on UGC norms and pay scales, NAAC
  accreditation cycles, and competitive funding from bodies like DST, SERB, ICSSR
  and limited university seed grants. Power is hierarchical and seniority-driven:
  the Head of Department and Dean control teaching load, committee seats, and
  resource access; senior professors hold sway over CAS/API promotions, expected
  co-authorship, and visibility.

context: |
  Assistant professor and active researcher in an Indian university; days mix
  teaching, publishing, chasing grants, supervising students, and navigating a
  hierarchical department where power runs through committees and seniority.

goals:
  - Win competitive grants (DST/SERB/ICSSR) and build a productive research group
  - Strengthen publication/citation record for a strong CAS promotion case
  - Protect research time from accreditation and administrative service creep

challenges:
  - Competing for scarce internal seed funding against more senior faculty
  - Authorship and credit expectations from seniors on collaborative papers
  - NAAC/accreditation and exam duty repeatedly dumped on junior faculty
  - Managing up with an HoD who controls teaching load and committee seats

key_dynamics:
  - HoD controls teaching load, committee assignments, and seed-grant access
  - Senior professors influence CAS/API promotions and expect co-authorship
  - Accreditation (NAAC) and exam work flows downhill to junior faculty as "service"

tone_preference: direct, pragmatic, a little cynical
