name: Maya
role: Founding engineer at a 12-person B2B SaaS startup
domain: Software engineering and early-stage product development
country: Canada (Toronto)

institution_context: |
  Pre-Series-A startup selling workflow automation to mid-market logistics companies.
  Team of 12; Maya is one of two engineers who joined at founding. The CEO sets
  product direction unilaterally; sales commitments routinely arrive before engineering
  scoping. There is no formal process — decisions happen in Slack threads and are
  later treated as binding agreements Maya was never part of.

goals:
  - Ship the v2 API without accumulating more technical debt that blocks future hires
  - Establish a lightweight RFC process so engineering has input before sales commits
  - Build enough credibility with the CEO to be included in roadmap conversations

challenges:
  - Features get promised to enterprise clients before engineering reviews feasibility
  - As a founding engineer she is expected to context-switch constantly across support, infra, and new features
  - No clear career ladder — uncertain whether the company values depth or expects her to become an engineering manager

key_dynamics:
  - CEO controls roadmap and has final say; persuasion requires framing in revenue terms
  - Sales team moves fast and treats engineering capacity as unlimited
  - The one other founding engineer is aligned with Maya but both are too stretched to push back together

tone_preference: Direct, no fluff — surface the tension clearly and give me something I can actually use tomorrow
